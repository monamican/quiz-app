<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App - Home</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Quiz App</h1>
      <img class="character-image" src="https://static.wikitide.net/greatcharacterswiki/thumb/1/18/Taz_Devil.png/300px-Taz_Devil.png" alt="Description of image">
    </header>

    <main class="content">
      <article class="card">
        <button class="bookmark-btn" aria-label="Save bookmark">
          <!-- Empty Bookmark Icon -->
          <svg aria-hidden="true">...</svg>
        </button>
        <h2 class="question">
          If you buy a state-of-the-art $50 interactive pet toy, how will the
          two animals react?
        </h2>

       
        <button class="btn-show-answer" onclick="window.location.href = 'bookmarks.html'">Show Answer</button>
<div class="tags">
        <div class="tags">
          <span class="tag">Love it!</span>
          <span class="tag">Boo!</span>
          <span class="tag">Meeeh!</span>
        </div>
      </article>

      <article class="card">
        <button class="bookmark-btn active" aria-label="Remove bookmark">
          <!-- Filled Bookmark Icon -->
          <svg aria-hidden="true">...</svg>
        </button>
        <h2 class="question">
          How do dogs and cats make you feel guilty when you pack a suitcase for
          a vacation?
        </h2>

         <button class="btn-show-answer" onclick="window.location.href = 'bookmarks.html'">Show Answer</button>
        <div class="tags">
          <span class="tag">Love it!</span>
          <span class="tag">Boo!</span>
          <span class="tag">Meeeh!</span>
        </div>
      </article>
    </main>

    <footer class="navigation">
      <a href="index.html" class="nav-item active" aria-label="Home">
        <span class="icon-home-filled"></span>
      </a>
      <a href="bookmarks.html" class="nav-item" aria-label="Bookmarks">
        <span class="icon-bookmark-empty"></span>
      </a>
      <a href="profile.html" class="nav-item" aria-label="Profile">
        <span class="icon-profile-empty"></span>
      </a>
    </footer>
  </body>
</html>
