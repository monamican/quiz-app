<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App - Home</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Quiz App</h1>
      <img
        class="character-image"
        src="https://static.wikitide.net/greatcharacterswiki/thumb/1/18/Taz_Devil.png/300px-Taz_Devil.png"
        alt="Description of image"
      />
    </header>

    <main class="content">
      <!-- Question 1 -->
      <article class="card">
        <!-- We use a label instead of a button -->
<label class="bookmark-btn" style="cursor: pointer; position: absolute; top: 15px; right: 15px; display: flex; align-items: center; gap: 5px; font-weight: bold; font-family: sans-serif;">
  
  <!-- This hidden checkbox does the "magic" of remembering the click -->
  <input type="checkbox" class="hidden-checkbox" style="display: none;">
  
  <span>Book me mark!</span>
  
  <svg
    class="bookmark-icon"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    width="24"
    height="24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
  </svg>
</label>

<!-- We put the CSS right inside the HTML using the <style> tag -->
<style>
  /* When the hidden checkbox is checked, find the SVG next to it and fill it with black */
  .hidden-checkbox:checked ~ .bookmark-icon {
    fill: #ef2d2d;
  }
</style>
        </button>
        <h2 class="question">
          If you buy a state-of-the-art $50 interactive pet toy, how will the
          two animals react?
        </h2>

        <button
          class="btn-show-answer"
          onclick="window.location.href = 'bookmarks.html'"
        >
          Show Answer
        </button>

        <div class="tags">
          <span class="tag">Love it!</span>
          <span class="tag">Boo!</span>
          <span class="tag">Meeeh!</span>
        </div>
      </article>

      <!-- Question 2 -->
      <article class="card">
        <label class="bookmark-btn" style="cursor: pointer; position: absolute; top: 15px; right: 15px; display: flex; align-items: center; gap: 5px; font-weight: bold; font-family: sans-serif;">
  
  <!-- This hidden checkbox does the "magic" of remembering the click -->
  <input type="checkbox" class="hidden-checkbox" style="display: none;">
  
  <span>Book me mark!</span>
  
  <svg
    class="bookmark-icon"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    width="24"
    height="24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
  </svg>
</label>
        
        <h2 class="question">
          How do dogs and cats make you feel guilty when you pack a suitcase for
          a vacation?
        </h2>

        <button
          class="btn-show-answer"
          onclick="window.location.href = 'bookmarks.html'"
        >
          Show Answer
        </button>

        <div class="tags">
          <span class="tag">Love it!</span>
          <span class="tag">Boo!</span>
          <span class="tag">Meeeh!</span>
        </div>
      </article>
    </main>

    <footer class="navigation" style="background-color: rgb(153, 122, 219)">
      <a href="index.html" class="nav-item active">
        <img src="caravan.svg" class="nav-icon" />
      </a>

      <a href="bookmarks.html" class="nav-item">
        <img src="bookmark-check.svg" alt="Bookmarks" class="nav-icon" />
      </a>

      <a href="profile.html" class="nav-item" aria-label="">
        <img src="ghost.svg" alt="Profile" class="nav-icon" />
      </a>
    </footer>
  </body>
</html>
