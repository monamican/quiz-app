<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App - Home</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Quiz App</h1>
      <img
        class="character-image"
        src="https://static.wikitide.net/greatcharacterswiki/thumb/1/18/Taz_Devil.png/300px-Taz_Devil.png"
        alt="Description of image"
      />
    </header>

    <main class="content">
      <!-- Question 1 -->
      <article class="card">
        <button class="bookmark-btn" aria-label="Save bookmark">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <h2 class="question">
          If you buy a state-of-the-art $50 interactive pet toy, how will the
          two animals react?
        </h2>

        <button
          class="btn-show-answer"
          onclick="window.location.href = 'bookmarks.html'"
        >
          Show Answer
        </button>

        <div class="tags">
          <span class="tag">Love it!</span>
          <span class="tag">Boo!</span>
          <span class="tag">Meeeh!</span>
        </div>
      </article>

      <!-- Question 2 -->
      <article class="card">
        <button class="bookmark-btn active" aria-label="Remove bookmark">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <h2 class="question">
          How do dogs and cats make you feel guilty when you pack a suitcase for
          a vacation?
        </h2>

        <button
          class="btn-show-answer"
          onclick="window.location.href = 'bookmarks.html'"
        >
          Show Answer
        </button>

        <div class="tags">
          <span class="tag">Love it!</span>
          <span class="tag">Boo!</span>
          <span class="tag">Meeeh!</span>
        </div>
      </article>
    </main>

    <footer class="navigation">
      <a href="index.html" class="nav-item active" aria-label="Home">
        <span class="icon-home-filled"></span>
      </a>
      <a href="bookmarks.html" class="nav-item" aria-label="Bookmarks">
        <span class="icon-bookmark-empty"></span>
      </a>
      <a href="profile.html" class="nav-item" aria-label="Profile">
        <span class="icon-profile-empty"></span>
      </a>
    </footer>

    <div class="footer">
      <p>🎪 Powered by Quiz Nepa 🎰</p>
    </div>

    <!-- Toggle logic for the bookmark buttons -->
    <script>
      document.querySelectorAll(".bookmark-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          btn.classList.toggle("active");
          const isBookmarked = btn.classList.contains("active");
          btn.setAttribute(
            "aria-label",
            isBookmarked ? "Remove bookmark" : "Save bookmark",
          );
        });
      });
    </script>
  </body>
</html>
