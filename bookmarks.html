<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App - Bookmarks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Quiz App</h1>
    </header>

    <main class="content">
      <article class="card">
        <button class="bookmark-btn active" aria-label="Remove bookmark">
          <!-- Filled Bookmark Icon -->
          <svg aria-hidden="true">...</svg>
        </button>
        <h2 class="question">
          If you buy a state-of-the-art $50 interactive pet toy, how will the
          two animals react? ?
        </h2>
        <p class="answer">
          The dog will destroy the toy in exactly five minutes. The cat will
          ignore the toy completely and play with the crinkly receipt it came
          with.
        </p>
        <button class="btn-show-answer">Show Answer</button>
        <div class="tags">
          <span class="tag">html</span>
          <span class="tag">css</span>
          <span class="tag">flexbox</span>
        </div>
      </article>

      <article class="card">
        <button class="bookmark-btn active" aria-label="Remove bookmark">
          <!-- Filled Bookmark Icon -->
          <svg aria-hidden="true">...</svg>
        </button>
        <h2 class="question">Question ?</h2>
        <p class="answer">Answer</p>
        <button class="btn-show-answer">Show Answer</button>
        <div class="tags">
          <span class="tag">html</span>
          <span class="tag">css</span>
          <span class="tag">flexbox</span>
        </div>
      </article>
    </main>

    <footer class="navigation">
      <a href="index.html" class="nav-item" aria-label="Home">
        <span class="icon-home-empty"></span>
      </a>
      <a href="bookmarks.html" class="nav-item active" aria-label="Bookmarks">
        <span class="icon-bookmark-filled"></span>
      </a>
      <a href="profile.html" class="nav-item" aria-label="Profile">
        <span class="icon-profile-empty"></span>
      </a>
    </footer>
  </body>
</html>
