<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App - Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Quiz App</h1>
    </header>

    <main class="content profile-content">
      <section class="profile-header">
        <div class="avatar" aria-hidden="true">
          <!-- Avatar Icon/Image Placeholder -->
        </div>
        <h2 class="profile-name">Max Doe</h2>
      </section>

      <section class="profile-section">
        <h3>About me</h3>
        <div class="text-lines">
          <p class="line"></p>
          <p class="line short"></p>
          <p class="line"></p>
        </div>
      </section>

      <section class="stats-container">
        <div class="stat-badge">
          <span class="stat-icon">❓</span>
          <span class="stat-count">12</span>
        </div>
        <div class="stat-badge">
          <span class="stat-icon">🔖</span>
          <span class="stat-count">4</span>
        </div>
      </section>

      <section class="profile-section">
        <h3>Settings</h3>
        <div class="setting-item">
          <span>Dark Mode</span>
          <label class="toggle-switch">
            <input type="checkbox" aria-label="Toggle Dark Mode" />
            <span class="slider"></span>
          </label>
        </div>
      </section>
    </main>

    <footer class="navigation">
      <a href="index.html" class="nav-item" aria-label="Home">
        <span class="icon-home-empty"></span>
      </a>
      <a href="bookmarks.html" class="nav-item" aria-label="Bookmarks">
        <span class="icon-bookmark-empty"></span>
      </a>
      <a href="profile.html" class="nav-item active" aria-label="Profile">
        <span class="icon-profile-filled"></span>
      </a>
    </footer>
  </body>
</html>
