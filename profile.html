<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App - Profil</title>
    <link rel="stylesheet" href="styles.css" />

    
  </head>
  <body>
    <header class="header">
      <h1>Quiz App</h1>
    </header>

    <main class="content">
      <!-- 1. Profil Kartı -->
      <article class="card profile-card">
        <h2 class="question">Profil</h2>

        <!-- Profil Fotoğrafı Alanı -->
        <div class="profile-image-container">
          <img
            src="saskin.jpeg"
            alt="Profile Picture"
            class="profile-avatar"
            id="profile-pic-image"
          />
        </div>

        <!-- Profil Etiketleri -->
        <div class="tags" id="profile-tags">
          <span class="tag">My Name is Moon</span>
          <span class="tag">Student</span>
          <span class="tag">Full-Stack Student</span>
        </div>
      </article>

      <!-- 2. Yeni Bilgi Ekleme Kartı -->
      <article class="card">
        <h2 class="question">Add new info</h2>

        <!-- Yazı alanı -->
        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
          "
        >
          <textarea
            id="custom-info"
            rows="3"
            placeholder="Type your info here..."
            style="
              padding: 10px;
              border-radius: 8px;
              border: 1px solid #ccc;
              font-family: inherit;
              resize: vertical;
              outline: none;
            "
          ></textarea>
        </div>

        <!-- Kaydet Butonu (Tıklanınca JavaScript'i çalıştırır) -->
        <button class="btn-show-answer" onclick="bilgiyiEkle()">Save</button>
      </article>

     
          <input
            type="checkbox"
            class="hidden-checkbox"
            style="display: none"
          />
          <!-- SVG etiketi düzeltildi -->
         
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
        </label>
      </article>
    </main>

    <!-- Alt Navigasyon Menüsü -->
    <footer class="navigation" style="background-color: rgb(153, 122, 219)">
      <a href="index.html" class="nav-item">
        <img src="caravan.svg" class="nav-icon" />
      </a>
      <a href="bookmarks.html" class="nav-item">
        <img src="bookmark-check.svg" class="nav-icon" />
      </a>
      <a href="profile.html" class="nav-item">
        <img src="ghost.svg" class="nav-icon" />
      </a>
      <!-- Yeni Ekleme (Add) İkonu -->
  <a href="form" class="nav-item">
    <img src="plus.png" class="nav-icon" />
  </a>
    </footer>

    <!-- Yeni Bilgi Ekleyen JavaScript Kodumuz -->
    <script>
      function bilgiyiEkle() {
        const metinKutusu = document.getElementById("custom-info");
        const yeniBilgi = metinKutusu.value.trim();

        if (yeniBilgi !== "") {
          const yeniKutu = document.createElement("span");
          yeniKutu.className = "tag";
          yeniKutu.textContent = yeniBilgi;

          document.getElementById("profile-tags").appendChild(yeniKutu);
          metinKutusu.value = ""; // İşlem bitince kutuyu temizler
        } else {
          alert("Please enter some info!"); // Kutuyu boş bırakırsa uyarı verir
        }
      }
    </script>
    <!-- Bu butonu her sayfanın üst kısımlarına bir yere yerleştir -->
<button class="dark-mode-toggle" style="padding: 10px; cursor: pointer; border-radius: 8px;">
  🌙 Dark Mode Toggle
</button>  
  </body>
</html>
